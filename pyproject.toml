[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-value-counter"
version = "1.0.0"
description = "Count occurrences of values in one CSV column."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "seipass"}]

[project.scripts]
csv-value-counter = "csv_value_counter:main"

[tool.setuptools]
py-modules = ["csv_value_counter"]

[tool.pytest.ini_options]
pythonpath = ["."]
